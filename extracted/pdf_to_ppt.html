<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI PDF to PPT Converter</title>
    <!-- 필수 라이브러리 로드 -->
    <script src="default_js/pdf.min.js"></script>
    <script src="default_js/pptxgen.bundle.js"></script>
    <script src="default_js/tesseract.min.js"></script>
    
    <script src="default_js/worker.min.js"></script>
    <script src="default_js/tesseract-core.wasm.js"></script>
    <script src="default_js/pdf-lib.min.js"></script>
    <script src="default_js/qpdf.js"></script>


    <style>
        :root { 
            --primary: #FF416C; 
            --primary-hover: #FF4B2B;
            --secondary: #4facfe;
            --bg: #f8f9fa; 
            --card: #ffffff; 
            --border: #e0e0e0;
            --text-main: #333;
            --text-sub: #666;
        }

        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            width: 100%; 
            max-width: 1100px; 
            background: var(--card); 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 30px; 
        }
        
        h1 { 
            margin-top: 0; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--primary); 
            font-size: 24px;
        }

        /* --- 드롭존 스타일 --- */
        .drop-zone { 
            border: 2px dashed #ccc; 
            border-radius: 12px; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 20px; 
            background: #fafafa;
        }
        .drop-zone:hover, .drop-zone.dragover { 
            border-color: var(--primary); 
            background: #fff5f5; 
        }
        .drop-zone h3 { margin: 10px 0 5px; color: #555; }
        .drop-zone p { color: #888; font-size: 14px; margin: 0; }

        /* --- 진행 상태 스타일 --- */
        .progress-area { display: none; margin-bottom: 20px; }
        .progress-bar { 
            width: 100%; 
            height: 10px; 
            background: #eee; 
            border-radius: 5px; 
            overflow: hidden; 
            margin-top: 5px; 
        }
        .progress-fill { 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, #FF4B2B, #FF416C); 
            transition: width 0.3s ease; 
        }
        .log-box { 
            height: 120px; 
            overflow-y: auto; 
            background: #1e1e1e; 
            color: #00ff00; 
            padding: 10px; 
            font-family: monospace; 
            font-size: 12px; 
            border-radius: 6px; 
            margin-top: 10px; 
        }

        /* --- 버튼 공통 --- */
        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            transition: 0.2s; 
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(255, 65, 108, 0.3); 
        }

        /* --- 미리보기 그리드 --- */
        .preview-area { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 15px; 
            margin-top: 30px; 
        }
        .slide-card { 
            border: 1px solid #eee; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative; 
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #fff;
        }
        .slide-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        .slide-card img { width: 100%; display: block; }
        .slide-info { 
            padding: 10px; 
            font-size: 12px; 
            background: #fafafa; 
            border-top: 1px solid #eee; 
            color: #666;
        }

        /* --- 비주얼 에디터 모달 --- */
        .hidden { display: none !important; }
        
        .modal-overlay { 
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 1000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            backdrop-filter: blur(5px);
        }
        
        .modal-content { 
            background: white; 
            width: 95%; max-width: 1200px; height: 90vh; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); 
            animation: fadeIn 0.3s ease;
        }

        .modal-header { 
            padding: 15px 20px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #fff; 
        }
        .modal-header h2 { margin: 0; font-size: 18px; color: #333; }
        
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .close-btn { 
            background: none; border: none; 
            font-size: 28px; cursor: pointer; color: #999; 
            line-height: 1; 
        }
        .close-btn:hover { color: #333; }

        /* 에디터 레이아웃 */
        .visual-editor-layout { 
            display: flex; 
            height: 100%; 
            overflow: hidden; 
            background: #e9ecef; 
        }
        
        /* 중앙 캔버스 영역 */
        .canvas-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: auto; 
            padding: 40px;
        }
        
        .editor-stage {
            position: relative;
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
            background: white;
            user-select: none; 
        }
        
        .editor-stage img {
            display: block;
            max-width: 800px; /* 작업하기 편한 크기 제한 */
            pointer-events: none; 
        }
        
        .editor-overlays {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* 편집 박스 */
        .edit-box {
            position: absolute;
            border: 1px solid rgba(33, 150, 243, 0.5); /* 기본 파란 테두리 */
            background: rgba(255, 255, 255, 0.1);
            cursor: move;
            box-sizing: border-box;
            transition: background 0.1s;
            /* 텍스트가 잘리지 않도록 설정 */
            overflow: visible !important; 
            white-space: pre-wrap;
            word-break: break-word;
            display: flex;
            align-items: flex-start;
            padding: 2px;
        }
        .edit-box:hover { 
            border-color: #2196F3; 
            background: rgba(255, 255, 255, 0.3); 
            z-index: 100; /* 호버 시 맨 위로 */
        }

        .edit-box.selected { 
            border: 2px solid #2196F3; 
            background: rgba(33, 150, 243, 0.1); 
            z-index: 200; 
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
        }
        
        .edit-box-content {
            font-size: 10px; color: #000; 
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            background: rgba(255,255,255,0.85); 
            padding: 2px 4px; 
            pointer-events: none;
            position: absolute; top: 0; left: 0; max-width: 100%;
        }


        /* 인라인 편집 모드일 때 스타일 */
        .edit-box:focus {
            outline: none;
            background: white;
            border: 2px solid #FF416C;
            z-index: 300;
            color: black !important; /* 편집 중엔 글자 잘 보이게 */
            cursor: text;
        }

        /* 크기 조절 핸들 (우측 하단) */
        .resize-handle {
            width: 10px;
            height: 10px;
            background-color: #2196F3;
            position: absolute;
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
            border-radius: 50%;
            z-index: 301;
            display: none; /* 평소엔 숨김 */
        }

        .edit-box:hover .resize-handle,
        .edit-box.selected .resize-handle {
            display: block; /* 호버하거나 선택되면 보임 */
        }

        .btn-unlock {
            position: absolute;
            top: 30px;
            right: 50px;
            background: #fe8f4f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-unlock:hover {
            background: #fe9d00b7;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(123, 95, 1, 0.578);
        }

        /* 우측 속성 사이드바 */
        .property-sidebar {
            width: 320px;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .property-sidebar h4 { margin: 0 0 10px 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        
        .prop-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .prop-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; resize: vertical; box-sizing: border-box; }
        .prop-group input[type=text], .prop-group input[type=number] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box;
        }
        .prop-group input[type=color] {
            width: 40px; height: 36px; border: none; padding: 0; background: none; cursor: pointer;
        }
        .prop-group.checkbox { display: flex; align-items: center; gap: 8px; }
        .prop-group.checkbox input { width: auto; margin: 0; transform: scale(1.2); }
        
        .tool-btn { 
            padding: 6px 12px; 
            background: #f1f3f5; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 600;
            color: #495057;
        }
        .tool-btn:hover { background: #e9ecef; }
        
        .btn-delete { 
            width: 100%; padding: 10px; 
            background: #fff5f5; color: #e03131; border: 1px solid #ffc9c9; 
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; 
        }
        .btn-delete:hover { background: #ffe3e3; }

        .modal-footer { 
            padding: 15px 20px; 
            border-top: 1px solid #eee; 
            background: #fff; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-footer .btn { width: auto; font-size: 14px; padding: 10px 24px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📑 AI PDF to PPT 변환기</h1>

        <!-- ✅ 암호 해제 버튼 -->
        <button id="btn-unlock-pdf" class="btn-unlock">🔐 PDF 암호 해제 (다중)</button>
        <!-- ✅ 다중 파일 선택을 위한 숨겨진 Input -->
        <input type="file" id="unlock-pdf-input" accept="application/pdf" multiple hidden>

        <p style="color: #666; margin-bottom: 20px;">PDF를 이미지로 분석하여 편집 가능한 파워포인트로 재구성합니다.</p>
        <!-- 파일 드롭 영역 -->
        <div id="drop-zone" class="drop-zone">
            <span style="font-size: 40px;">📂</span>
            <h3>PDF 파일 업로드</h3>
            <p>클릭하거나 파일을 여기로 드래그하세요.</p>
            <input type="file" id="pdf-input" accept="application/pdf" hidden>
        </div>

        <!-- 진행바 및 로그 -->
        <div id="progress-area" class="progress-area">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span id="status-text" style="font-weight: 600; font-size: 14px;">처리 대기 중...</span>
                <span id="percent-text" style="font-weight: bold; color: var(--primary);">0%</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <div id="log-box" class="log-box"></div>
        </div>

        <!-- 메인 액션 버튼 -->
        <button id="btn-convert" class="btn" disabled>🚀 PPTX 변환 및 다운로드</button>

        <!-- 미리보기 카드 영역 -->
        <div id="preview-area" class="preview-area"></div>
    </div>

    <!-- ✅ [Visual Editor] 상세 편집 모달 -->
    <div id="editor-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ AI 슬라이드 비주얼 에디터</h2>
                <div class="header-controls">
                    <button id="btn-add-text" class="tool-btn">➕ 텍스트 추가</button>
                    <button id="btn-close-editor" class="close-btn">&times;</button>
                </div>
            </div>
            
            <div class="modal-body visual-editor-layout">
                <!-- 중앙: 작업 캔버스 -->
                <div class="canvas-container">
                    <div id="editor-stage" class="editor-stage">
                        <img id="editor-ref-image" src="" alt="Slide Background">
                        <div id="editor-overlays" class="editor-overlays"></div>
                    </div>
                </div>

                <!-- 우측: 속성 패널 -->
                <div class="property-sidebar">
                    <h4>속성 편집</h4>
                    <div id="selected-properties" class="hidden">
                        <div class="prop-group">
                            <label>내용 (Text)</label>
                            <textarea id="prop-content" rows="4"></textarea>
                        </div>
                        <div class="prop-group">
                            <label>글자 크기 (pt)</label>
                            <input type="number" id="prop-size" min="8" max="200">
                        </div>
                        <div class="prop-group">
                            <label>글자 색상</label>
                            <div style="display:flex; gap:5px;">
                                <input type="color" id="prop-color">
                                <input type="text" id="prop-color-text" style="flex:1;">
                            </div>
                        </div>
                        <div class="prop-group checkbox">
                            <label><input type="checkbox" id="prop-bold"> <strong>Bold (굵게)</strong></label>
                        </div>
                        <div class="prop-actions">
                            <button id="btn-delete-element" class="btn-delete">🗑️ 요소 삭제</button>
                        </div>
                    </div>
                    
                    <!-- 선택 없을 때 안내 메시지 -->
                    <div id="no-selection-msg" style="color:#888; text-align:center; margin-top:50px;">
                        <span style="font-size:40px; display:block; margin-bottom:10px;">👆</span>
                        이미지 위의 박스를 클릭하여<br>내용과 스타일을 수정하세요.
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <span style="font-size:12px; color:#666;">* 박스를 드래그하여 위치를 조정할 수 있습니다.</span>
                <button id="btn-save-changes" class="btn">💾 편집 완료 (저장)</button>
            </div>
        </div>
    </div>

    <!-- 로직 스크립트 연결 -->
    <script src="pdf_to_ppt.js"></script>
</body>
</html>
