<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>초안 팝업 미리보기</title>
    <link rel="stylesheet" href="draft-preview.css">
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-hero">
        <div>
          <p class="eyebrow">Draft Popup</p>
          <h1 id="previewTitle">초안 미리보기</h1>
          <p id="previewUpdatedAt" class="meta hidden"></p>
        </div>
        <div class="hero-actions">
          <button id="refreshButton" class="ghost" type="button">새로고침</button>
          <button id="closeButton" class="primary" type="button">닫기</button>
        </div>
      </header>

      <section id="previewEmpty" class="card empty-state">
        열어둘 초안이 없습니다. 사이드패널에서 초안을 만든 뒤 다시 시도하세요.
      </section>

      <section id="previewContent" class="content-grid hidden">
        <section class="card feedback-card">
          <div class="section-header">
            <div>
              <p class="section-label">피드백 반영</p>
              <p class="meta">사이드패널처럼 이 팝업에서도 수정 요청을 전달하고 반영된 초안을 바로 확인할 수 있습니다.</p>
            </div>
            <div class="section-actions">
              <button id="editDraftButton" class="ghost" type="button">직접 수정</button>
              <button id="saveDraftButton" class="primary hidden" type="button">수정 저장</button>
              <button id="cancelEditButton" class="ghost hidden" type="button">취소</button>
              <button id="applyFeedbackButton" class="primary" type="button">피드백 반영</button>
            </div>
          </div>
          <textarea id="previewFeedbackInput" placeholder="예: 도입부를 더 자연스럽게, 키워드 반복을 줄이고 결론에 CTA 추가"></textarea>
          <p id="previewStatus" class="status">대기 중</p>
        </section>

        <section class="card summary-card">
          <p id="previewSummary" class="summary"></p>
          <div id="previewTags" class="tag-list"></div>
        </section>

        <section class="card draft-card">
          <div id="previewHtml" class="draft-body"></div>
        </section>
      </section>
    </main>

    <script src="error-localization.js"></script>
    <script src="ui-language.js"></script>
    <script src="draft-preview.js"></script>
  </body>
</html>
